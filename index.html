<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>OmniTriage AI - Real-Time Voice & Multimodal Agent</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen p-6 font-sans">
    <div class="max-w-3xl mx-auto p-6 bg-slate-800 rounded-xl shadow-2xl mt-10">
        <h1 class="text-2xl font-bold text-amber-400 mb-2">OmniTriage AI Agent (PS 05)</h1>
        <p class="text-slate-400 mb-6">Real-Time Multimodal Voice, Video & Text Ingestion System</p>
        
        <div class="space-y-5">
            <!-- True Live Microphone Stream Input -->
            <div class="p-4 bg-slate-900 rounded border border-slate-700">
                <label class="block text-sm font-semibold text-amber-300 mb-2">🎙️ 1. Live Voice Audio Transcription:</label>
                <button onclick="toggleSpeech()" id="micBtn" class="bg-red-600 hover:bg-red-700 text-white font-bold px-4 py-2 rounded transition text-sm flex items-center gap-2">
                    🔴 Start Speaking (Live Mic)
                </button>
                <p id="voiceStatus" class="text-xs text-slate-400 mt-2">Click and speak your medical query clearly into your microphone.</p>
            </div>

            <!-- Video / Image Multimodal Input -->
            <div class="p-4 bg-slate-900 rounded border border-slate-700">
                <label class="block text-sm font-semibold text-amber-300 mb-2">📷 2. Multimodal Vision / Video / Image Input:</label>
                <input type="file" id="mediaInput" accept="image/*,video/*" class="w-full text-sm text-slate-400 file:mr-4 file:py-2 file:px-4 file:rounded file:border-0 file:text-sm file:font-semibold file:bg-amber-500 file:text-slate-950 hover:file:bg-amber-600"/>
            </div>

            <!-- Text / Symptom Description Input -->
            <div>
                <label class="block text-sm font-semibold text-amber-300 mb-1">✍️ 3. Live Translated Transcript (Editable):</label>
                <textarea id="symptomInput" rows="3" class="w-full p-3 rounded bg-slate-900 border border-slate-700 text-white text-sm" placeholder="Your spoken words will automatically appear here..."></textarea>
            </div>

            <button onclick="submitTriage()" class="w-full bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold px-6 py-3 rounded transition shadow-lg">
                Process Multimodal Triage Stream 🚀
            </button>
        </div>

        <div id="outputSection" class="mt-8 hidden p-4 bg-slate-900 rounded border border-slate-700">
            <h3 class="text-lg font-semibold text-emerald-400 mb-2">Structured Triage JSON Output (Dynamic):</h3>
            <pre id="jsonOutput" class="text-xs text-slate-300 overflow-x-auto bg-slate-950 p-3 rounded"></pre>
        </div>
    </div>

    <script>
        let recognition = null;
        let recognizing = false;

        function toggleSpeech() {
            const micBtn = document.getElementById('micBtn');
            const voiceStatus = document.getElementById('voiceStatus');
            const inputField = document.getElementById('symptomInput');

            // Check browser support
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                alert("Speech recognition is not supported in this browser. Please use Google Chrome on desktop or Android.");
                return;
            }

            if (!recognizing) {
                recognition = new SpeechRecognition();
                recognition.continuous = false;
                recognition.interimResults = true;
                recognition.lang = 'en-US';

                recognition.onstart = function() {
                    recognizing = true;
                    micBtn.className = "bg-emerald-600 text-white font-bold px-4 py-2 rounded transition text-sm flex items-center gap-2 animate-pulse";
                    micBtn.innerText = "🎙️ Listening... Speak Now!";
                    voiceStatus.innerText = "Microphone active. Speak your symptoms clearly.";
                };

                recognition.onresult = function(event) {
                    let interimTranscript = '';
                    let finalTranscript = '';

                    for (let i = event.resultIndex; i < event.results.length; ++i) {
                        if (event.results[i].isFinal) {
                            finalTranscript += event.results[i][0].transcript;
                        } else {
                            interimTranscript += event.results[i][0].transcript;
                        }
                    }

                    if (finalTranscript) {
                        inputField.value = finalTranscript;
                    } else if (interimTranscript) {
                        inputField.value = interimTranscript;
                    }
                };

                recognition.onerror = function(event) {
                    voiceStatus.innerText = "⚠️ Speech Error: " + event.error + ". Make sure mic permissions are allowed.";
                    resetMicButton();
                };

                recognition.onend = function() {
                    resetMicButton();
                    if (!inputField.value) {
                        voiceStatus.innerText = "No speech detected. Try clicking again and speaking louder.";
                    } else {
                        voiceStatus.innerText = "Speech translated successfully!";
                    }
                };

                try {
                    recognition.start();
                } catch (e) {
                    voiceStatus.innerText = "Error starting microphone: " + e.message;
                    resetMicButton();
                }
            } else {
                recognition.stop();
                resetMicButton();
            }
        }

        function resetMicButton() {
            recognizing = false;
            const micBtn = document.getElementById('micBtn');
            micBtn.className = "bg-red-600 hover:bg-red-700 text-white font-bold px-4 py-2 rounded transition text-sm flex items-center gap-2";
            micBtn.innerText = "🔴 Start Speaking (Live Mic)";
        }

        async function submitTriage() {
            const text = document.getElementById('symptomInput').value;
            const fileInput = document.getElementById('mediaInput');
            const fileName = fileInput.files.length > 0 ? fileInput.files[0].name : "None attached";

            if (!text) {
                alert("Please speak into your microphone or type your symptoms first!");
                return;
            }

            const response = await fetch('/api/process-triage', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ symptom_text: text, media_file: fileName })
            });
            const result = await response.json();
            document.getElementById('outputSection').classList.remove('hidden');
            document.getElementById('jsonOutput').innerText = JSON.stringify(result, null, 2);
        }
    </script>
</body>
</html>
